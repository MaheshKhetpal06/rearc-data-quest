name: Deploy

# Deploys definitions only. Running the job is manual, to protect the Free Edition compute quota.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Bundle target
        type: choice
        options: [dev, prod]
        default: prod
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: databricks/setup-cli@main
      - run: pip install build
      - run: databricks bundle validate -t "${{ inputs.target || 'prod' }}"
      - run: databricks bundle deploy -t "${{ inputs.target || 'prod' }}"
